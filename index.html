<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1712">
<title>CricVox v0</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0e1712; --surface:#16231c; --surface2:#1e3027; --line:#2e4638;
  --text:#eef1e8; --muted:#9db3a5; --accent:#56c27d; --accent-ink:#06210f;
  --amber:#f0b849; --red:#c8402f; --straw:#cdbb8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 24px}
.wrap.capture{padding-bottom:230px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.mark{font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark b{color:var(--accent);font-weight:800}
.spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.badge.off{color:var(--amber);border-color:var(--amber)}
.badge.off i{background:var(--amber)}
.linkbtn{background:none;border:0;color:var(--accent);padding:10px 4px;font-weight:600;min-height:44px}

/* setup */
.hero{padding:18px 0 6px}
.hero h1{font-size:40px;line-height:1;letter-spacing:-.03em;font-weight:800}
.hero p{color:var(--muted);margin-top:8px;font-size:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
input[type=text],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:13px 12px;min-height:50px}
textarea{min-height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  font-weight:800;font-size:18px;margin-top:16px}
.ghost{min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-weight:600;padding:10px 14px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.bw{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px;margin-top:8px}
.bw input[type=text],.bw select{background:var(--surface)}
.bwh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bwh span{width:20px;text-align:center;color:var(--muted);font-weight:700}
.bwh input{flex:1}
.bwh .x{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted)}

/* capture */
.ctx{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px;min-height:56px;display:flex;align-items:center;gap:10px}
.ctx .who{flex:1;min-width:0}
.ctx .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .who div:first-child{font-weight:700}
.ctx .who div:last-child{font-size:13px;color:var(--muted)}
.ctx span.edit{color:var(--accent);font-weight:600;font-size:14px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.chart svg{display:block;width:100%;height:auto}
.chart h3{font-size:12px;color:var(--muted);font-weight:600;padding:2px 4px 0}
.confirm{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.confirm.live{border-color:var(--red)}
.confirm .head{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.confirm .head b{color:var(--text);font-size:15px}
.raw{margin:6px 0 10px;font-size:15px;font-style:italic;color:var(--text);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);
  color:var(--text);font-weight:600;font-size:15px;display:inline-flex;flex-direction:column;justify-content:center;
  align-items:flex-start;line-height:1.15}
.chip small{font-size:10.5px;font-weight:500;color:var(--muted)}
.chip.need{border:2px dashed var(--amber);background:rgba(240,184,73,.14);color:var(--amber)}
.chip.need small{color:var(--amber)}
.chip.opt{background:transparent;color:var(--muted);font-weight:500}
.issues{margin-top:10px;font-size:13px;color:var(--amber)}
.last{display:flex;gap:8px;margin-top:10px;align-items:center}
.last .lbl{font-size:12px;color:var(--muted);width:44px;line-height:1.2}
.pill{flex:1;max-width:52px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-weight:700;position:relative;padding:0}
.pill small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.pill.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pill.w{background:var(--red);border-color:var(--red)}
.pill.w small{color:#fff}
.pill.gap::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.empty{color:var(--muted);font-size:15px;padding:6px 0}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--bg) 78%,rgba(14,23,18,0));
  padding:18px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:520px;margin:0 auto}
.typebox{display:flex;gap:8px}
.typebox input{flex:1}
.typebox button{min-width:72px;border-radius:12px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}
.act{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.act .ghost{width:104px}
.mic{width:92px;height:92px;border-radius:50%;border:0;padding:0;background:none;position:relative}
.mic svg{width:92px;height:92px;display:block}
.mic.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--red);animation:pulse 1.1s ease-out infinite}
.mic.na{opacity:.45}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on::after{animation:none}}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:4px;min-height:17px}

/* toast + sheet */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(238px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;
  max-width:88vw;text-align:center;display:none}
#sheet{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.55);align-items:flex-end}
#sheet.open{display:flex}
.panel{width:100%;max-width:520px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);
  padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto}
.panel h2{font-size:18px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.three{grid-template-columns:1fr 1fr 1fr}
.opts button{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-weight:600;padding:8px}
.opts button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts button.clear{color:var(--muted);grid-column:1/-1}

/* summary */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:22px;line-height:1.1}
.tile span{font-size:11.5px;color:var(--muted)}
.bars div{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.bars i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.bars em{font-style:normal;text-align:right;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
.foot b{color:var(--text)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.filters button{flex:0 0 auto;min-height:44px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600}
.filters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* tests */
.test{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.test:first-of-type{border-top:0}
.test q{quotes:"“" "”";font-style:italic}
.test .res{font-weight:800;margin-right:6px}
.pass{color:var(--accent)} .fail{color:var(--red)}
.test code{display:block;color:var(--muted);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-top:4px;overflow-wrap:anywhere}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet"></div>

<script>
'use strict';
/* =====================================================================
   1. VOCABULARY  (canonical values from glossary.md + v0 spec)
   ===================================================================== */
var SCHEMA_VERSION = '0.2';
var V = {
  length: ['full_toss','yorker','full','good','back_of_a_length','short'],
  line: ['wide_outside_off','outside_off','off_stump','middle','leg_stump','outside_leg','wide_outside_leg'],
  shot: ['drive','cut','pull','hook','sweep','reverse_sweep','glance','flick','defence','leave','edge','scoop','slog'],
  sector: ['third_man','point','cover','mid_off','mid_on','mid_wicket','square_leg','fine_leg'],
  depth: ['inner','deep'],
  trajectory: ['ground','lofted','high'],
  runs: [0,1,2,3,4,6],
  boundary: ['four','six'],
  extras: ['wide','no_ball','bye','leg_bye','penalty'],
  wicket: ['bowled','caught','caught_behind','lbw','run_out','stumped','hit_wicket','obstructing_the_field','timed_out','retired'],
  hand: ['right','left'],
  side: ['over_the_wicket','round_the_wicket'],
  bowler_type: ['fast','medium','left_arm_fast','left_arm_medium','off_spin','leg_spin','left_arm_orthodox','left_arm_wrist_spin'],
  keeper_position: ['up','back'],
  net: ['open','closed','off_open','leg_open','back_blocked']
};
var BALL_KEYS = ['length','line','shot','sector','depth','region','trajectory','runs','boundary','extras','wicket'];
var CTX_KEYS = ['hand','side','bowler_type','keeper_position'];

/* =====================================================================
   2. PARSER  — START  (replaceable section)
   Contract:  CricVoxParser.parse(text) returns
     { kind: 'ball' | 'context' | 'correction' | 'undo' | 'empty',
       fields:  { length, line, shot, sector, depth, region, trajectory,
                  runs, boundary, extras, wicket }   // only keys it found
       context: { hand, side, bowler_type, keeper_position,
                  batter_name, bowler_name }         // only keys it found
       unmatched: [words], parser: 'rules-0.2' }
   No DOM, no storage, no network. Swap this block for another parser
   (for example a language model) as long as it returns the same shape.
   ===================================================================== */
var CricVoxParser = (function () {
  var VERSION = 'rules-0.2';
  var LEX = [];
  function add(set) { for (var i = 1; i < arguments.length; i++) LEX.push([arguments[i], set]); }

  // Length
  add({length:'full_toss'}, 'full toss', 'beamer', 'high full toss');
  add({length:'yorker'}, 'yorker', 'toe crusher', 'in the blockhole', 'blockhole');
  add({length:'full'}, 'full', 'half volley', 'fuller', 'overpitched', 'over pitched');
  add({length:'good'}, 'good length', 'nagging length');
  add({length:'back_of_a_length'}, 'back of a length', 'just short of a length', 'short of a length', 'back of length');
  add({length:'short'}, 'short', 'short pitched', 'short pitch', 'short ball', 'bouncer', 'bumper');

  // Line
  add({line:'wide_outside_off'}, 'wide outside off', 'wide of off', 'wide outside off stump', 'wide outside the off stump');
  add({line:'wide_outside_off', bare_wide:true}, 'wide');
  add({line:'outside_off'}, 'outside off', 'outside off stump', 'outside the off stump', 'off side', 'fourth stump', 'corridor');
  add({line:'off_stump'}, 'off stump', 'on off', 'on off stump');
  add({line:'middle'}, 'middle', 'middle stump', 'on the stumps', 'straight');
  add({line:'leg_stump'}, 'leg stump', 'on leg', 'on leg stump');
  add({line:'outside_leg'}, 'down leg', 'outside leg', 'outside leg stump', 'down the leg side');
  add({line:'wide_outside_leg'}, 'wide down leg', 'wide outside leg');

  // Shots (named shots may imply a direction; a spoken region always wins)
  add({shot:'drive'}, 'drive', 'driven', 'drives');
  add({shot:'drive', implied_sector:'mid_off'}, 'straight drive');   // straight = straight zone on the off side
  add({implied_sector:'mid_off'}, 'straight down the ground', 'down the ground', 'back past the bowler');
  add({shot:'drive', implied_sector:'cover'}, 'cover drive');
  add({shot:'drive', implied_sector:'mid_on'}, 'on drive');
  add({shot:'drive', implied_sector:'mid_off'}, 'off drive');
  add({shot:'cut'}, 'cut', 'cuts');
  add({shot:'cut', implied_sector:'point'}, 'square cut');
  add({shot:'cut', implied_sector:'third_man'}, 'late cut', 'upper cut', 'uppercut');
  add({shot:'pull'}, 'pull', 'pulled', 'pulls');
  add({shot:'hook'}, 'hook', 'hooked', 'hooks');
  add({shot:'sweep'}, 'sweep', 'swept', 'slog sweep', 'paddle', 'paddle sweep');
  add({shot:'reverse_sweep'}, 'reverse sweep', 'reverse swept', 'reverse', 'switch hit');
  add({shot:'glance'}, 'glance', 'glanced', 'tickle', 'tickled', 'helped away');
  add({shot:'flick'}, 'flick', 'flicked', 'whip', 'whipped', 'clip', 'clipped');
  add({shot:'defence'}, 'defend', 'defended', 'defends', 'block', 'blocked', 'defence', 'defense',
      'forward defence', 'forward defense', 'solid defence', 'solid defense');
  add({shot:'leave'}, 'leave', 'leaves', 'left alone', 'let go');
  add({shot:'edge'}, 'edge', 'edged', 'nick', 'nicked', 'outside edge', 'inside edge', 'top edge');
  add({shot:'scoop'}, 'scoop', 'scooped', 'ramp', 'ramped', 'dilscoop');
  add({shot:'slog'}, 'slog', 'slogged', 'heave', 'heaved', 'hoick', 'cow corner shot');

  // Fielding regions -> wagon sector + depth (8 sectors)
  // The spoken region is kept as wagon.region (glossary canonical name)
  function region(name, sector, depth) { var s = {region: name, depth: depth}; if (sector) s.sector = sector; return s; }
  add(region('slip','third_man','inner'), 'slip', 'slips', 'first slip', 'second slip', 'third slip');
  add(region('gully','third_man','inner'), 'gully');
  add(region('short_third_man','third_man','inner'), 'short third man');
  add(region('third_man','third_man','deep'), 'third man', 'deep third man');
  add(region('point','point','inner'), 'point');
  add(region('backward_point','point','inner'), 'backward point');
  add(region('deep_point','point','deep'), 'deep point', 'deep backward point');
  add(region('cover','cover','inner'), 'cover', 'covers');
  add(region('extra_cover','cover','inner'), 'extra cover');
  add(region('deep_cover','cover','deep'), 'deep cover', 'deep extra cover');
  add(region('mid_off','mid_off','inner'), 'mid off', 'midoff');
  add(region('long_off','mid_off','deep'), 'long off', 'deep mid off');
  add(region('mid_on','mid_on','inner'), 'mid on', 'midon');
  add(region('long_on','mid_on','deep'), 'long on', 'deep mid on');
  add(region('mid_wicket','mid_wicket','inner'), 'mid wicket', 'midwicket');
  add(region('deep_mid_wicket','mid_wicket','deep'), 'deep mid wicket', 'deep midwicket', 'cow corner');
  add(region('square_leg','square_leg','inner'), 'square leg');
  add(region('deep_square_leg','square_leg','deep'), 'deep square', 'deep square leg');
  add(region('fine_leg','fine_leg','deep'), 'fine leg', 'fine', 'deep fine leg');
  add(region('short_fine_leg','fine_leg','inner'), 'short fine leg');
  add(region('sweeper',null,'deep'), 'sweeper');

  // Trajectory
  add({trajectory:'ground'}, 'along the ground', 'all along the ground', 'on the ground', 'along the carpet');
  add({trajectory:'lofted'}, 'lofted', 'loft', 'in the air', 'over the top', 'over the infield', 'aerial', 'chipped');
  add({trajectory:'high'}, 'high', 'skied', 'sky high', 'high in the air', 'up in the air', 'straight up');

  // Runs
  add({runs:0}, 'dot', 'dot ball', 'no run', 'no runs', 'nothing');
  add({runs:1}, 'one', 'one run', 'single', 'a single', '1');
  add({runs:2}, 'two', 'two runs', '2');
  add({runs:3}, 'three', 'three runs', '3');
  add({runs:4, boundary:'four'}, 'four', 'four runs', 'boundary', 'chauka', 'chaukka', '4');
  add({runs:6, boundary:'six'}, 'six', 'maximum', 'chakka', 'chhakka', '6');

  // Extras
  add({extras:'wide'}, 'wide ball', 'called wide', 'wides');
  add({extras:'no_ball'}, 'no ball', 'noball', 'front foot no ball');
  add({extras:'bye'}, 'bye', 'byes');
  add({extras:'leg_bye'}, 'leg bye', 'leg byes');
  add({extras:'penalty'}, 'penalty', 'five penalty');

  // Dismissals
  add({wicket:'bowled'}, 'bowled', 'clean bowled');
  add({wicket:'caught'}, 'caught', 'caught at', 'caught out');
  add({wicket:'caught_behind'}, 'caught behind', 'keeper catch');
  add({wicket:'lbw'}, 'lbw', 'l b w', 'leg before', 'leg before wicket');
  add({wicket:'run_out'}, 'run out');
  add({wicket:'stumped'}, 'stumped');
  add({wicket:'hit_wicket'}, 'hit wicket');
  add({wicket:'obstructing_the_field'}, 'obstructing', 'obstructing the field', 'handled the ball');
  add({wicket:'timed_out'}, 'timed out');
  add({wicket:'retired'}, 'retired', 'retired out', 'retired hurt');

  // Sticky context that can be spoken inside a ball
  add({side:'over_the_wicket'}, 'over the wicket');
  add({side:'round_the_wicket'}, 'round the wicket', 'around the wicket');
  add({bowler_type:'fast'}, 'seamer', 'pacer', 'fast bowler', 'quick bowler', 'pace bowler');
  add({bowler_type:'medium'}, 'medium pace', 'medium pacer');
  add({bowler_type:'left_arm_fast'}, 'left arm fast', 'left arm pace', 'left arm quick', 'left arm seamer', 'left arm pacer', 'left arm seam');
  add({bowler_type:'left_arm_medium'}, 'left arm medium', 'left arm medium pace', 'left arm medium pacer');
  add({bowler_type:'off_spin'}, 'off spin', 'off spinner', 'off break', 'offie');
  add({bowler_type:'leg_spin'}, 'leg spin', 'leg spinner', 'leg break', 'leggie');
  add({bowler_type:'left_arm_orthodox'}, 'left arm orthodox', 'left arm spin', 'left arm spinner');
  add({bowler_type:'left_arm_wrist_spin'}, 'left arm wrist spin', 'left arm unorthodox');
  add({keeper_position:'up'}, 'keeper up', 'keeper standing up', 'up to the stumps');
  add({keeper_position:'back'}, 'keeper back', 'standing back');
  add({hand:'left'}, 'left hander', 'left handed', 'left hand batter', 'lefty');
  add({hand:'right'}, 'right hander', 'right handed', 'right hand batter');

  // Phrases that would otherwise be misread; they set nothing
  add({}, 'well bowled', 'bowled a', 'bowled it',
      'through the off side', 'one bounce', 'short leg', 'short one', 'full one', 'good one', 'that one', 'this one', 'wide one');

  LEX.sort(function (a, b) { return b[0].length - a[0].length; });   // longest phrase first

  function clean(t) {
    return String(t || '').toLowerCase().replace(/[\u2019']/g, '').replace(/[^a-z0-9]+/g, ' ')
      .replace(/\b1st\b/g, 'first').replace(/\b2nd\b/g, 'second')
      .replace(/\b3rd\b/g, 'third').replace(/\b4th\b/g, 'fourth').trim();
  }

  // Speech-to-text mishearings -> cricket terms. raw_text keeps what was heard; only parsing uses these.
  // The built-in list is a first guess: [VERIFY] with real recordings in M02.
  var ALIAS = [
    ['woodland','good length'], ['wood land','good length'], ['good land','good length'], ['good lens','good length'],
    ['good lent','good length'], ['goodlength','good length'], ['could length','good length'], ['wood length','good length'],
    ['yorka','yorker'], ['yoker','yorker'], ['yolker','yorker'], ['york a','yorker'],
    ['full toes','full toss'], ['full tose','full toss'], ['fulltoss','full toss'],

    if (e.target.dataset.root === 'draft') S.draft[b] = e.target.value;
    else setPath(formCtx(), b, /\.type$/.test(b) && e.target.value === '' ? null : e.target.value);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'typed') { e.preventDefault(); ACT.typed(); }
    if (e.key === 'Escape' && S.sheet) closeSheet();
  });
  window.addEventListener('online', render);
  window.addEventListener('offline', render);
  render();
})();
</script>
